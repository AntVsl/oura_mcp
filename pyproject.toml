[project]
name = "oura-mcp"
version = "0.1.0"
description = "MCP-сервер для доступа к данным Oura Ring"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.28",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.scripts]
oura-mcp = "oura_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oura_mcp"]

[tool.uv]
# cryptography>=49 не публикует колесо под x86_64 macOS и лезет собираться из
# Rust-исходников, упираясь в OpenSSL. Касается не только Intel-машин: на Apple
# Silicon с Homebrew в /usr/local весь Python-стек тоже x86_64. На Linux и
# нативном arm64 колёса есть, поэтому ограничение прицельное.
constraint-dependencies = [
    "cryptography==48.0.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
