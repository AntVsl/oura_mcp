[project]
name = "my-oura-mcp"
version = "0.3.0"
description = "MCP server for Oura Ring data: sleep, readiness, HRV, resting heart rate"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anton Vasilev" }]
keywords = ["mcp", "oura", "health", "sleep", "hrv", "claude", "wearable"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]

dependencies = [
    # Верхняя граница обязательна: в mcp 2.x точка входа переименована
    # (FastMCP -> MCPServer), и наш импорт на ней не соберётся.
    "mcp>=1.28,<2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
    # cryptography приезжает транзитивно через mcp -> pyjwt[crypto]. С версии 49
    # под x86_64 macOS колёс нет, и установка уходит собирать Rust, упираясь в
    # OpenSSL. Ограничение стоит здесь, а не в [tool.uv]: то действует только
    # внутри репозитория и не защищает тех, кто ставит пакет из PyPI.
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.urls]
Homepage = "https://github.com/AntVsl/oura_mcp"
Repository = "https://github.com/AntVsl/oura_mcp"
Issues = "https://github.com/AntVsl/oura_mcp/issues"
Changelog = "https://github.com/AntVsl/oura_mcp/blob/main/CHANGELOG.md"

[project.scripts]
my-oura-mcp = "my_oura_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_oura_mcp"]

[tool.uv]
# cryptography>=49 не публикует колесо под x86_64 macOS и лезет собираться из
# Rust-исходников, упираясь в OpenSSL. Касается не только Intel-машин: на Apple
# Silicon с Homebrew в /usr/local весь Python-стек тоже x86_64. На Linux и
# нативном arm64 колёса есть, поэтому ограничение прицельное.
constraint-dependencies = [
    "cryptography==48.0.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
