# Развёртывание на сервере из опубликованного образа.
#
# Отличие от compose.yml: образ тянется с Docker Hub, а не собирается на месте.
# Сборка требует заметно больше памяти, чем есть на дешёвом VPS, — на 1 ГБ она
# уходит в своп и не заканчивается.
#
# Сам по себе этот файл поднимает MCP без входа снаружи: порт остаётся внутри
# сети Docker. Вход выбирается вторым файлом, потому что зависит от того, можно
# ли светить IP этого сервера:
#
#   docker compose -f compose.server.yml -f compose.caddy.yml  up -d
#   docker compose -f compose.server.yml -f compose.tunnel.yml up -d
#
# Именно двумя файлами, а не профилями: Compose интерполирует переменные во
# всех сервисах, включая выключенные профилем, и `${OURA_DOMAIN:?...}` в
# неактивном Caddy валит запуск туннеля.

services:
  oura-mcp:
    image: iican/oura-mcp:${OURA_TAG:-0.2.2}
    restart: unless-stopped
    env_file: .env

    # Эти четыре значения заданы здесь, а не в .env, намеренно: `environment`
    # в Compose перекрывает `env_file`, и перенос локального .env на сервер не
    # сможет их испортить. Особенно важен OURA_TOKEN_STORE — локально он
    # указывает на .oura/tokens.json, которого внутри контейнера нет, и сервер
    # молча остался бы неавторизованным.
    environment:
      OURA_TOKEN_STORE: /data/tokens.json
      OURA_CACHE_DB: /data/cache.db
      OURA_TZ: ${OURA_TZ:-Europe/Moscow}
      OURA_API_MODE: ${OURA_API_MODE:-production}

    volumes:
      - oura-data:/data

    # Порт наружу не публикуется: снаружи видно только вход из второго файла.
    expose:
      - "8000"

    # Метки watchtower нет намеренно. Там, где он запущен с --label-enable, он
    # обновляет только помеченные контейнеры. Автообновление сервера с
    # медданными по появлению нового тега — не то, что нужно: релиз должен
    # быть решением, а не побочным эффектом.

volumes:
  oura-data:
