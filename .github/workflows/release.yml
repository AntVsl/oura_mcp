name: Release

# Публикация запускается только тегом вида v0.1.0 и только вручную созданным.
# Обратной дороги нет: версию, once опубликованную в PyPI, переиздать нельзя.
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing: PyPI доверяет этому репозиторию по OIDC,
      # и хранить API-токен в секретах не требуется.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Fail if tag and pyproject version disagree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$TAG" != "$PKG" ]; then
            echo "Тег $TAG не совпадает с версией в pyproject.toml ($PKG)" >&2
            exit 1
          fi

      - name: Run tests before publishing
        run: |
          uv sync --extra dev
          uv run pytest -q

      - name: Build
        run: uv build

      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    runs-on: ubuntu-latest
    environment: release
    env:
      # Имя пользователя и образа секретом не является — оно публично объявлено
      # в server.json. Держать его в secrets вредно: GitHub маскирует секреты в
      # логах, и теги сборки читались бы как ***/oura-mcp.
      DOCKERHUB_USERNAME: iican
      IMAGE: iican/oura-mcp

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          # Метки задаются явно. По умолчанию они берутся из метаданных
          # репозитория GitHub, а там описания нет — в 0.1.0 уехал образ с
          # пустым org.opencontainers.image.description и title=oura_mcp.
          labels: |
            org.opencontainers.image.title=my-oura-mcp
            org.opencontainers.image.description=MCP server for Oura Ring data: sleep, readiness, HRV, resting heart rate
            org.opencontainers.image.documentation=https://github.com/AntVsl/oura_mcp#readme
            org.opencontainers.image.licenses=MIT
            # Доказательство владения образом для реестра MCP: значение должно
            # совпадать с полем "name" в server.json. Без метки публикация
            # отвергается с 400, причём уже после того, как образ собран и
            # выложен, — то есть чинится только новым релизом.
            io.modelcontextprotocol.server.name=io.github.AntVsl/oura-mcp

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Публикация в реестр MCP идёт последней и зависит от обеих предыдущих:
  # реестр проверяет, что артефакты уже существуют и несут доказательства
  # владения — токен `mcp-name:` в описании пакета PyPI и метку
  # io.modelcontextprotocol.server.name на образе. Запусти раньше — получишь
  # 400 на пустом месте.
  registry:
    runs-on: ubuntu-latest
    needs: [pypi, docker]
    environment: release
    permissions:
      # OIDC вместо интерактивного `login github`: тот выдаёт токен меньше чем
      # на час, и вручную это означает гонку между входом и публикацией. За одну
      # сессию я трижды упёрся в протухший токен, пока разбирался с отказами.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          VERSION=v1.8.0
          curl -fsSL -o publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/mcp-publisher_linux_amd64.tar.gz"
          tar xzf publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: Wait for artifacts to become visible
        # PyPI и Docker Hub отдают новую версию не мгновенно: в наблюдениях
        # задержка доходила до двух минут. Реестр в этот промежуток видит
        # «пакета нет» и отказывает.
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          for i in $(seq 1 20); do
            SEEN=$(curl -fsSL https://pypi.org/pypi/my-oura-mcp/json | python3 -c 'import json,sys;print(json.load(sys.stdin)["info"]["version"])')
            echo "попытка $i: PyPI отдаёт $SEEN, ждём $VERSION"
            [ "$SEEN" = "$VERSION" ] && exit 0
            sleep 15
          done
          echo "PyPI так и не показал $VERSION" >&2
          exit 1

      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
