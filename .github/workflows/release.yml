name: Release

# Публикация запускается только тегом вида v0.1.0 и только вручную созданным.
# Обратной дороги нет: версию, once опубликованную в PyPI, переиздать нельзя.
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing: PyPI доверяет этому репозиторию по OIDC,
      # и хранить API-токен в секретах не требуется.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Fail if tag and pyproject version disagree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$TAG" != "$PKG" ]; then
            echo "Тег $TAG не совпадает с версией в pyproject.toml ($PKG)" >&2
            exit 1
          fi

      - name: Run tests before publishing
        run: |
          uv sync --extra dev
          uv run pytest -q

      - name: Build
        run: uv build

      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    runs-on: ubuntu-latest
    environment: release
    env:
      # Имя пользователя и образа секретом не является — оно публично объявлено
      # в server.json. Держать его в secrets вредно: GitHub маскирует секреты в
      # логах, и теги сборки читались бы как ***/oura-mcp.
      DOCKERHUB_USERNAME: iican
      IMAGE: iican/oura-mcp

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
